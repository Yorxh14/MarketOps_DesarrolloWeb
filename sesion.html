<!DOCTYPE html>
<html lang="es">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="d-flex justify-content-center align-items-center vh-100 bg-light">
        <div class="card shadow rounded-4 p-4 ajusteSesion" >
            <h2 class="colorIniciarSesion">Iniciar Sesion</h2>
            <p class="tamanoP">Bienvenido! Inicia sesion para acceder al panel de control</p>
            <hr>
            <div class="mb-3">
                <label class="form-label">Correo</label>
                
                <input type="email" class="form-control" id="nombreID" placeholder="nombre@gmail.com" >
                <label id="errorCorreo" class="text-danger small"></label>
                <br>
                <br>
                <label class="form-label">Contrasena</label>
                <input type="password" class="form-control" id="passwordID" placeholder="********" >
                <label id="errorContra" class="text-danger small"></label>
                <br>
                
                <div class="form-check mt-2 mb-3">
                    <input class="form-check-input" type="checkbox" id="verPass" onclick="MostrarOcultarContraseña()">
                    <label class="form-check-label" for="verPass">Mostrar contrasena</label>
                    
                </div>

                <button type="button" class="btn btn-primary" onclick="Validacion()">Iniciar Sesion</button>
                
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
