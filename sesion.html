<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body>
    <div class="d-flex justify-content-center align-items-center vh-100 bg-light">

        <form class="card shadow rounded-4 p-4 ajusteSesion" x-data="sesionApp()" x-init="cargarCuentas()" @submit.prevent="validarLogin()">
            <h2 class="colorIniciarSesion">Iniciar Sesion</h2>
            <p class="tamanoP">Bienvenido! Inicia sesion para acceder al panel de control</p>    
            <hr>
            <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="email" class="form-control" id="nombreID" placeholder="nombre@gmail.com" x-model="correo">
                <label class="text-danger small" x-text="errorCorreo" x-show="errorCorreo !== ''"></label>
                <br>
                <br>
                <label class="form-label">Contrasena</label>
                <input x-bind:type="tipoDeInput()" class="form-control" placeholder="********" x-model="contrasena">
                <label class="text-danger small" x-text="errorContra" x-show="errorContra !== ''"></label>
                <br>
                <div class="form-check mt-2 mb-3">
                    <input class="form-check-input" type="checkbox" id="verPass" x-model="verPass">
                    <label class="form-check-label" for="verPass">Mostrar contrasena</label>
                    
                </div>
                <p class="text-danger fw-bold text-center" x-show="mensajeGeneral !== ''" x-text="mensajeGeneral"></p>

                <button type="submit" class="btn btn-primary" >Iniciar Sesion</button>
            </div>
        </form>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
