<!DOCTYPE html>
<html lang="es">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
    <div class="d-flex justify-content-center align-items-center vh-100 bg-light">
        <div class="card shadow rounded-4 p-4" style="width: 100%; max-width: 400px;">
            <h2 style="color: rgb(1, 14, 24);">Iniciar Sesión</h2>
            <p style="font-size: 13px; opacity: 0.7;">Bienvenido! Inicia sesion para acceder al panel de control</p>
            <hr>
            <div class="mb-3">
                <label class="form-label">Correo</label>
                
                <input type="email" class="form-control" id="nombreID" placeholder="nombre@gmail.com" >
                <label id="errorCorreo" class="text-danger small"></label>
                <br>
                <br>
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="passwordID" placeholder="********" >
                <br>
                
                <div class="form-check mt-2 mb-3">
                    <input class="form-check-input" type="checkbox" id="verPass" onclick="MostrarOcultarContraseña()">
                    <label class="form-check-label" for="verPass">Mostrar contraseña</label>
                    
                </div>

                <button type="button" class="btn btn-primary" onclick="ErrorNombre()">Iniciar Sesion</button>
                
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
